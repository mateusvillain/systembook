name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A versão do pnpm vem do campo packageManager do package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stress do dev (temporário)
        run: |
          for i in 1 2 3 4 5; do pnpm --filter @systembook/cli test 2>&1 | grep -E "Tests |×|systembook dev >" ; done

      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Test
        run: pnpm -r --if-present run test

      # O exemplo do modo estático (examples/static-docs) é a fixture de
      # ponta a ponta: conteúdo → check → site, com previews.
      - name: Build do exemplo estático
        run: pnpm --filter @systembook/example-static-docs build
